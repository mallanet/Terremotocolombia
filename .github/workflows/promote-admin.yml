name: Promote admin

# Sends production traffic to an already-uploaded admin Worker version.
# Does not rebuild.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full git SHA of the uploaded artifact
        required: true
        type: string
      worker_version_id:
        description: Optional Worker Version ID. Must belong to source_sha.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-admin
  cancel-in-progress: false

jobs:
  promote:
    name: Promote admin Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-admin
      url: https://admin.terremotocolombia.co
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Install wrangler
        working-directory: admin
        run: npm ci

      - name: Promote uploaded version
        working-directory: admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
        run: |
          doppler run --command '
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            export SOURCE_SHA="'"$SOURCE_SHA"'"
            export WORKER_VERSION_ID="'"$WORKER_VERSION_ID"'"
            bash ../scripts/release/promote-worker-version.sh
          '

      - name: Domain smoke including served admin SHA
        env:
          SHA_TARGETS: admin
        run: bash scripts/smoke/domain-smoke.sh production ${{ inputs.source_sha }}
