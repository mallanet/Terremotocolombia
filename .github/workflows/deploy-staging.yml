name: Deploy staging

# Despliega el entorno de STAGING completo:
#   frontend -> terremotocolombia-web-staging  (staging.terremotocolombia.co)
#   API      -> terremotocolombia-api-staging  (api-staging.terremotocolombia.co)
#   base     -> rama `staging` de Neon (datos aparte de produccion)
#
# A DIFERENCIA DE PRODUCCION, AQUI EL BACKEND TAMBIEN SE DESPLIEGA SOLO.
# Es justo el motivo de existir de staging: si probar un cambio de API exigiera
# un paso manual, nadie lo probaria y volveriamos a estrenar en produccion.
# En `main` el backend es MANUAL: solo sale por workflow_dispatch
# (`deploy-backend.yml`), nunca con el merge.
#
# Se despliegan SIEMPRE los dos tiers, sin filtro de rutas, para que staging no
# quede con un frontend nuevo hablandole a una API vieja.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  backend:
    name: API de staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # DOPPLER_TOKEN_STAGING apunta al config `stg`, cuyo DATABASE_URL es la
      # rama `staging` de Neon. Nunca la base de produccion.
      - name: Schema capability gate
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: doppler run --command 'npm run check:platform-schema'

      - name: Deploy
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging --var APP_BUILD_SHA:'"$APP_BUILD_SHA"'
          '

  admin:
    name: Admin de staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Detras del backend por el mismo motivo que el frontend: que el panel
    # nuevo hable con la API nueva.
    needs: backend
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: admin
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: admin
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: npx opennextjs-cloudflare build

      - name: Deploy
        working-directory: admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging --old-asset-ttl 604800 --var APP_BUILD_SHA:'"$APP_BUILD_SHA"'
          '

  frontend:
    name: Frontend de staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Detras del backend: el frontend se construye con NEXT_PUBLIC_API_URL
    # apuntando a la API de staging, asi que conviene que esa API ya sea la
    # nueva cuando el frontend salga.
    needs: backend
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: doppler run -- npx opennextjs-cloudflare build

      - name: Deploy
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --env staging --old-asset-ttl 604800 --var APP_BUILD_SHA:'"$APP_BUILD_SHA"'
          '

      # Misma purga del SW que en produccion (ver deploy-frontend.yml): el
      # borde lo retiene y un deploy del service worker no llegaria nunca.
      - name: Purgar service worker del borde
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STAGING }}
        run: |
          doppler run --command '
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/494895363b65d50699864543d005238a/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN_COLOMBIA_SCOPED" \
              -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://staging.terremotocolombia.co/sw.js\"]}"'

  smoke:
    name: Domain smoke (SHA + reports + Turnstile gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Domain smoke including served SHA
        env:
          SHA_TARGETS: all
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if bash scripts/smoke/domain-smoke.sh staging ${{ github.sha }}; then
              exit 0
            fi
            echo "intento $i falló; reintento"
            sleep 10
          done
          echo "Staging domain smoke failed"
          exit 1
