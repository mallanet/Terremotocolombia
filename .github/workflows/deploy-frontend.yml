name: Deploy frontend

# Uploads a production Worker version. Does NOT send production traffic.
# Promote with promote-frontend.yml after staging and identity checks.
#
# The backend is not touched here. It lives on terremotocolombia-api and
# deploy-backend.yml (manual upload + promote).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "config/deployment.config.json"
      - ".github/workflows/deploy-frontend.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-frontend
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload frontend version (no traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (OpenNext -> Workers)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: doppler run -- npx opennextjs-cloudflare build

      - name: Upload Worker version (no production traffic)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            export APP_BUILD_SHA="'"$APP_BUILD_SHA"'"
            bash ../scripts/release/upload-worker-version.sh
          '

      - name: Reminder
        run: |
          echo "::notice::Frontend version uploaded for ${{ github.sha }}. Production traffic is unchanged until promote-frontend.yml runs."
