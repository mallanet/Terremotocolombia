name: Deploy frontend

# Despliega SOLO el frontend (Cloudflare Workers, via @opennextjs/cloudflare).
#
# El backend NO se toca aqui. Vive en su propio Worker
# (terremotocolombia-api) y en su propio workflow, que ademas es MANUAL.
# Trabajar en frontend y hacer push a main nunca redespliega la API.
#
# El disparo va con lista de rutas: si un commit solo toca backend/ o docs/,
# este workflow ni siquiera arranca.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # La identidad del despliegue se INLINEA en el build del frontend
      # (lib/deployment-config.ts), asi que cambiarla obliga a reconstruir.
      - "config/deployment.config.json"
      - ".github/workflows/deploy-frontend.yml"
  # Para redesplegar sin tener que tocar un fichero.
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez. `cancel-in-progress: false` a proposito: cortar un
# deploy a medias puede dejar el Worker con assets subidos y version sin
# promover — justo el estado que ya nos mordio una vez.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y deploy del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Un unico origen de secretos: Doppler. El workflow solo conoce
      # DOPPLER_TOKEN; el resto (site key de Turnstile, URL de la API,
      # credenciales de Cloudflare) lo inyecta `doppler run`.
      - uses: dopplerhq/cli-action@v3

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # El prebuild de este paquete copia config/deployment.config.json a
      # frontend/config/ (ver frontend/scripts/sync-deployment-config.mjs).
      # Sin esa copia el bundler no resuelve el import: se sale del paquete.
      - name: Build (OpenNext -> Workers)
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx opennextjs-cloudflare build

      # CLOUDFLARE_API_TOKEN es el nombre que espera wrangler; en Doppler el
      # token con permisos de Workers se llama CLOUDFLARE_ACCOUNT_API_TOKEN
      # (el otro, el de zona, NO puede desplegar Workers).
      #
      # Los dominios propios (apex + www) ya estan adjuntados al Worker por la
      # API de cuenta y NO se declaran en wrangler.jsonc: al declararlos,
      # wrangler llama tambien a /zones/{id}/workers/routes, para lo que este
      # token no tiene permiso, y el fallo aborta el deploy DESPUES de subir el
      # codigo pero ANTES de promover la version.
      - name: Deploy a Cloudflare Workers
        working-directory: frontend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run --command '
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN" \
            CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
            npx wrangler deploy --old-asset-ttl 86400'

      - name: Comprobar que el sitio responde
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://terremotocolombia.co/ || echo 000)
            echo "intento $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "El sitio no devolvio 200 tras el despliegue"
          exit 1
