name: Deploy backend

# Uploads or promotes the API Worker (terremotocolombia-api).
# Migrations stay a separate human-gated step (backend/worker/migrate.ts
# against Neon direct). This workflow never migrates.
#
# action=upload: typecheck, schema capability gate, wrangler versions upload.
# action=promote: versions deploy of the tagged SHA. Does not rebuild.
#
# OJO CON EL REF: the workflow deploys the ref you select, not always main.
# Merge to main before you run it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Upload a version with no traffic, or promote an uploaded SHA
        type: choice
        options:
          - upload
          - promote
        default: upload
      source_sha:
        description: Required for promote. Full git SHA tagged on upload.
        required: false
        type: string
      worker_version_id:
        description: Optional Worker Version ID for promote
        required: false
        type: string
      omitir_drift:
        description: >-
          Skip the schema-drift gate. ONLY for a hotfix that does not touch
          tables from a pending migration. The skip is visible in Actions.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  upload:
    if: ${{ inputs.action == 'upload' }}
    name: Upload API Worker version (no traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Schema capability gate
        if: ${{ inputs.omitir_drift != true }}
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --command 'npm run check:platform-schema'

      - name: Drift gate skipped
        if: ${{ inputs.omitir_drift == true }}
        run: |
          echo "::warning title=Schema gate SKIPPED::Uploading without checking the schema. Confirm this hotfix does not touch pending-migration tables."

      - name: Upload Worker version (no production traffic)
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            export APP_BUILD_SHA="'"$APP_BUILD_SHA"'"
            bash ../scripts/release/upload-worker-version.sh
          '

  promote:
    if: ${{ inputs.action == 'promote' }}
    name: Promote API Worker version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-backend
      url: https://api.terremotocolombia.co
    steps:
      - name: Require source SHA
        run: test -n "${{ inputs.source_sha }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Install wrangler
        working-directory: backend
        run: npm ci

      - name: Schema capability gate
        if: ${{ inputs.omitir_drift != true }}
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --command 'npm run check:platform-schema'

      - name: Promote uploaded version
        working-directory: backend
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
        run: |
          test -n "$SOURCE_SHA"
          doppler run --command '
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            export SOURCE_SHA="'"$SOURCE_SHA"'"
            export WORKER_VERSION_ID="'"$WORKER_VERSION_ID"'"
            bash ../scripts/release/promote-worker-version.sh
          '

      - name: Domain smoke including served API SHA
        env:
          SHA_TARGETS: api
        run: bash scripts/smoke/domain-smoke.sh production ${{ inputs.source_sha }}
