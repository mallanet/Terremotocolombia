name: Deploy admin

# Uploads a production admin Worker version. Does NOT send production traffic.
# Promote with promote-admin.yml.
on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
      - "scripts/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-admin
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload admin version (no traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Build (OpenNext -> Workers)
        working-directory: admin
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: npx opennextjs-cloudflare build

      - name: Upload Worker version (no production traffic)
        working-directory: admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          doppler run --command '
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_ACCOUNT_API_TOKEN"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            export APP_BUILD_SHA="'"$APP_BUILD_SHA"'"
            bash ../scripts/release/upload-worker-version.sh
          '

      - name: Reminder
        run: |
          echo "::notice::Admin version uploaded for ${{ github.sha }}. Production traffic is unchanged until promote-admin.yml runs."
